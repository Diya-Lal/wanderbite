[build]
  command = "cd ../.. && npm install && npm exec nx build destinations -- --configuration=production"
  publish = "dist/apps/destinations"

[build.environment]
  NODE_ENV = "production"
  NX_IGNORE_UNSUPPORTED_TS_SETUP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
