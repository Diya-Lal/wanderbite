<div class="wb-page">
  <!-- ── Navbar ── -->
  <nav class="wb-nav">
    <a class="wb-nav__brand" routerLink="/homepage">
      <span class="wb-nav__logo-icon">✦</span>
      <span class="wb-nav__logo-text">WanderBite</span>
    </a>
    <ul class="wb-nav__links">
      <li><a routerLink="/destination" routerLinkActive="active" class="wb-nav__link">Destinations</a></li>
      <li><a routerLink="/food" routerLinkActive="active" class="wb-nav__link">Restaurants</a></li>
      <li><a routerLink="/activities" routerLinkActive="active" class="wb-nav__link">Activities</a></li>
    </ul>
    <button class="wb-nav__hamburger" [class.is-open]="menuOpen()" (click)="toggleMenu()" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </nav>
  @if (menuOpen()) {
    <div class="wb-nav__overlay" (click)="toggleMenu()"></div>
    <nav class="wb-nav__mobile">
      <a routerLink="/destination" routerLinkActive="active" class="wb-nav__mobile-link" (click)="toggleMenu()">Destinations</a>
      <a routerLink="/food" routerLinkActive="active" class="wb-nav__mobile-link" (click)="toggleMenu()">Restaurants</a>
      <a routerLink="/activities" routerLinkActive="active" class="wb-nav__mobile-link" (click)="toggleMenu()">Activities</a>
    </nav>
  }

  <!-- ── Hero ── -->
  <section class="wb-hero">
    <div class="wb-hero__bg"></div>
    <div class="wb-hero__overlay"></div>

    <div class="wb-hero__content">
      <p class="wb-hero__eyebrow">Your journey begins here</p>

      <h1 class="wb-hero__title">
        Discover the World's<br />
        <em>Hidden Wonders</em>
      </h1>

      <p class="wb-hero__subtitle">
        Curated travel experiences that transform the<br />
        ordinary into the extraordinary.
      </p>

      <a routerLink="/destination" class="wb-hero__cta">
        <span class="wb-hero__cta-label">Explore Destinations</span>
        <span class="wb-hero__cta-arrow">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path
              d="M3 9h12M10 4l5 5-5 5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </a>
    </div>

    <!-- Decorative corner -->
    <div class="wb-hero__corner wb-hero__corner--tl"></div>
    <div class="wb-hero__corner wb-hero__corner--br"></div>
  </section>
</div>
